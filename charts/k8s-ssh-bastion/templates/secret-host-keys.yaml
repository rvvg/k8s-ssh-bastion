{{- $secretName := printf "%s-host-keys" .Release.Name -}}
{{- $secret := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $data := (get $secret "data") | default dict -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  {{- /* RSA Key */}}
  {{- $rsaKey := "" }}
  {{- if .Values.hostKeys.rsa }}
    {{- $rsaKey = .Values.hostKeys.rsa }}
  {{- else if hasKey $data "ssh_host_rsa_key" }}
    {{- $rsaKey = (get $data "ssh_host_rsa_key") | b64dec }}
  {{- else }}
    {{- $rsaKey = genPrivateKey "rsa" }}
  {{- end }}
  ssh_host_rsa_key: {{ $rsaKey | b64enc }}

  {{- /* ECDSA Key */}}
  {{- $ecdsaKey := "" }}
  {{- if .Values.hostKeys.ecdsa }}
    {{- $ecdsaKey = .Values.hostKeys.ecdsa }}
  {{- else if hasKey $data "ssh_host_ecdsa_key" }}
    {{- $ecdsaKey = (get $data "ssh_host_ecdsa_key") | b64dec }}
  {{- else }}
    {{- $ecdsaKey = genPrivateKey "ecdsa" }}
  {{- end }}
  ssh_host_ecdsa_key: {{ $ecdsaKey | b64enc }}

  {{- /* Ed25519 Key - Only if provided, as genPrivateKey produces incompatible format */}}
  {{- if .Values.hostKeys.ed25519 }}
  ssh_host_ed25519_key: {{ .Values.hostKeys.ed25519 | b64enc }}
  {{- end }}
